# 正式打包 + Gate B(打包后再测) + 发行 — docs/workstreams/gr-server/11-package-retest-publish.md。
# 前置: 同一 SHA 上 Gate A(gate-a.yml) 已全绿; 本流的 gate-a-status 强制校验并等待。
# 流程: prepare(共享 build_id) → fe(共享 FE/admin tgz, 单源) → package(双架构原生,
# 生产根钥 Secret, 不上传) → merge(组装 dist/release-<VER>/) → gate-b(用刚打出的包
# 安装/升级再测) → publish(Gate B 全绿才 tag v<VERSION> + Release, 拒绝覆盖已有 tag)。
# Gate B 红不 tag; 禁止「再编一份未测字节上传」。
name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Gate B 全绿后 tag + 上传 Release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gate-a-status:
    # 强制: 本次打包的 commit 必须先通过 Gate A (双架构 conclusion=success)。
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read   # check-runs API 需要读 checks — 仅 contents:read 会 403 → 守卫空转到超时
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: wait for gate-a on ${{ github.sha }}
        run: |
          set -euo pipefail
          # 只匹配 gate-a 矩阵 job ("gate-a (arch, os)")。注意不能 startswith("gate-a"):
          # 本 job 自身的 check-run 也叫 "gate-a-status", 会把 pend 永远占住 → 自等死锁。
          for i in $(seq 1 55); do
            out=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
                  --jq '[.check_runs[] | select(.name | startswith("gate-a ("))]') || out=""
            n=$(printf '%s' "$out" | jq 'length')
            if [[ "$n" -ge 2 ]]; then
              bad=$(printf '%s' "$out" | jq -r '[.[] | select(.conclusion != "success")] | length')
              pend=$(printf '%s' "$out" | jq -r '[.[] | select(.status != "completed")] | length')
              if [[ "$pend" == "0" ]]; then
                if [[ "$bad" == "0" ]]; then
                  echo "gate-a green on this SHA ($n jobs)"; exit 0
                fi
                printf '%s' "$out" | jq -r '.[] | "\(.name): \(.conclusion)"'
                echo "gate-a has non-success jobs — refusing to package" >&2; exit 1
              fi
            fi
            echo "waiting for gate-a completion (${i}/55)…"; sleep 60
          done
          echo "gate-a did not complete within timeout — refusing to package" >&2; exit 1

  prepare:
    # P0-1: 一次 release 一个 build_id, 全架构共享 (合并后的产物是同一身份)。
    needs: gate-a-status
    runs-on: ubuntu-24.04
    outputs:
      build_id: ${{ steps.gen.outputs.build_id }}
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - id: ver
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - id: gen
        run: echo "build_id=$(openssl rand -hex 12)" >> "$GITHUB_OUTPUT"

  fe:
    # FE 包必须出自单 job: 混淆输出跨 job 不确定, 而每个 arch manifest 必须
    # 哈希同一份 tgz。确定性 tar 头 (mtime/uid/order) + gzip -n。
    # (admin SPA 不再单独打包: 整包 bundle 内的 admin/ 直接取自仓内已构建树)
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install FE obfuscator
        run: npm install --prefix scripts/fe --no-audit --no-fund
      - name: Build shared FE bundle
        env:
          GR_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
        run: |
          set -euo pipefail
          VERSION=${{ needs.prepare.outputs.version }}
          bash scripts/fe/rebuild_bundles.sh
          mkdir -p dist/fe-bundle
          tar -C "$GITHUB_WORKSPACE" --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
              -cf - probe/fe | gzip -n -9 > "dist/fe-bundle/fe-${VERSION}.tgz"
          ls -l dist/fe-bundle/
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: fe-bundle
          path: dist/fe-bundle
          if-no-files-found: error

  package:
    needs: [prepare, fe]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - arch: aarch64
            os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88.0"
      - name: Assert version SSOT
        run: |
          set -euo pipefail
          ROOT_V=$(tr -d '[:space:]' < VERSION)
          FE_V=$(tr -d '[:space:]' < probe/fe/VERSION)
          CARGO_V=$(sed -n 's/^version = "\(.*\)"/\1/p' <(sed -n '/\[workspace.package\]/,/^\[/p' Cargo.toml) | head -1)
          PROBE_V=$(tr -d '[:space:]' < VERSION.probe)
          [[ "$ROOT_V" == "$FE_V" && "$ROOT_V" == "$CARGO_V" && "$ROOT_V" == "$PROBE_V" ]] || {
            echo "version drift" >&2; exit 1; }
      - name: Install FE obfuscator
        run: npm install --prefix scripts/fe --no-audit --no-fund
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: fe-bundle
          path: dist/fe-bundle
      - name: Build host arch release tree (production root key)
        env:
          HOST_ONLY: "1"
          SKIP_PUBLISH: "1"
          GR_BUILD_ID: ${{ needs.prepare.outputs.build_id }}
          GR_OTA_SIGNING_KEY: ${{ secrets.GR_OTA_SIGNING_KEY }}
        run: |
          set -euo pipefail
          VERSION=${{ needs.prepare.outputs.version }}
          if [[ -z "${GR_OTA_SIGNING_KEY:-}" ]]; then
            echo "GR_OTA_SIGNING_KEY secret is required (production root key; never keygen here)" >&2
            exit 1
          fi
          # Secret 以 base64 文本存放 (原始 32 字节会让 Actions 启动失败), 解码到
          # 与本地构建相同的 keys/ 布局; 私钥永不进 artifact / git。
          mkdir -p keys
          printf '%s' "$GR_OTA_SIGNING_KEY" | base64 -d > keys/ota_ed25519.sk
          chmod 600 keys/ota_ed25519.sk
          # 公钥来自仓内根副本, 且必须与 install.sh 钉死的指纹一致
          cp ota_ed25519.pk keys/ota_ed25519.pk
          pin=$(grep -oE '4a2296d3[0-9a-f]{56}|6dffd7d3[0-9a-f]{56}' install/install.sh | head -1)
          got=$(sha256sum keys/ota_ed25519.pk | awk '{print $1}')
          [[ "$got" == "$pin" ]] || { echo "root pk fingerprint drift: install.sh pins $pin, repo pk is $got" >&2; exit 1; }
          export GR_FE_MASTER_TGZ="dist/fe-bundle/fe-${VERSION}.tgz"
          [[ -f "$GR_FE_MASTER_TGZ" ]] || { echo "missing shared FE bundle" >&2; exit 1; }
          TARGETS="${{ matrix.arch }}" SKIP_PUBLISH=1 bash release/build_multiarch.sh
          mkdir -p dist/ci-${{ matrix.arch }}
          SRC="dist/release-${VERSION}"
          [[ -d "$SRC" ]] || SRC="dist/release-${VERSION}-${{ matrix.arch }}"
          [[ -d "$SRC" ]] || { echo "no dist tree under dist/release-${VERSION}*" >&2; find dist -maxdepth 2 -type d; exit 1; }
          # 只收发行资产文件 (排除 bundle/ 暂存树与签名私钥目录)
          find "$SRC" -maxdepth 1 -type f \
            \( -name 'greenpng-*.tar.gz' -o -name 'fe-*.tgz' -o -name 'manifest-index.json' \
               -o -name 'manifest.json' -o -name 'ota_ed25519.pk' -o -name 'build_id' \) \
            -exec cp -a {} "dist/ci-${{ matrix.arch }}/" \;
          python3 release/cargo_cyclonedx.py > "dist/ci-${{ matrix.arch }}/sbom.cdx.json"
          test -s "dist/ci-${{ matrix.arch }}/sbom.cdx.json"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-${{ matrix.arch }}
          path: dist/ci-${{ matrix.arch }}

  merge:
    # 组装 dist/release-<VER>/: per-arch manifest 已各自被根钥签署(内嵌自身
    # release_pubkey/cert), 合并只做重命名 + index + 一致性守卫, 不再重签。
    needs: [prepare, package]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist/artifacts
      - name: Merge per-arch trees + integrity guards
        run: |
          set -euo pipefail
          VERSION=${{ needs.prepare.outputs.version }}
          MERGE="dist/release-$VERSION"
          mkdir -p "$MERGE"
          python3 - <<'PY'
          import hashlib, json, pathlib
          version = open("VERSION").read().strip()
          merge = pathlib.Path(f"dist/release-{version}")
          merge.mkdir(parents=True, exist_ok=True)
          triples = {"x86_64": "x86_64-linux-gnu", "aarch64": "aarch64-linux-gnu"}
          index = {"product": "greenpng", "version": version, "architectures": {}, "fe": {}}
          manifests = {}
          for arch in ("x86_64", "aarch64"):
              arch_dir = pathlib.Path(f"dist/artifacts/release-{arch}")
              if not arch_dir.is_dir():
                  print(f"WARN: no release-{arch} artifact dir")
                  continue
              man_path = arch_dir / "manifest.json"
              if not man_path.is_file():
                  print(f"WARN: no manifest.json in {arch_dir}")
                  continue
              man = json.loads(man_path.read_text())
              assert man.get("product") == "greenpng", f"{arch} manifest product != greenpng"
              assert man.get("arch") == arch, f"{arch} manifest arch mismatch"
              bundle = arch_dir / f"greenpng-{version}-{arch}.tar.gz"
              assert bundle.is_file(), f"missing bundle for {arch}"
              # 双架构 manifest 的 fe.sha256 必须一致 (同一份共享 FE 包)
              manifests[arch] = man
              (merge / bundle.name).write_bytes(bundle.read_bytes())
              index["architectures"][arch] = {
                  "triple": triples[arch],
                  "bundle": bundle.name,
                  "bundle_sha256": hashlib.sha256(bundle.read_bytes()).hexdigest(),
                  "manifest": "manifest.json",
              }
          fe = pathlib.Path("dist/artifacts/release-x86_64") / f"fe-{version}.tgz"
          if not fe.is_file():
              fe = pathlib.Path("dist/artifacts/release-aarch64") / f"fe-{version}.tgz"
          assert fe.is_file(), "shared fe tgz missing from arch artifacts"
          (merge / fe.name).write_bytes(fe.read_bytes())
          index["fe"] = {"asset": fe.name, "sha256": hashlib.sha256(fe.read_bytes()).hexdigest()}
          (merge / "manifest-index.json").write_text(json.dumps(index, indent=2) + "\n")
          # 守卫 1: 双架构齐备
          assert set(index["architectures"]) == {"x86_64", "aarch64"}, "both architectures must be present"
          # 守卫 2: 每架构 manifest 的 fe.sha256 == 实际共享包 sha
          fe_sha = index["fe"]["sha256"]
          for arch, man in manifests.items():
              want = (man.get("fe") or {}).get("sha256")
              assert want == fe_sha, f"{arch} manifest fe sha {want} != shared {fe_sha}"
          # 守卫 3: 根公钥与 install.sh 钉值一致
          import re
          pin = re.search(r"4a2296d3[0-9a-f]{56}|6dffd7d3[0-9a-f]{56}", open("install/install.sh").read()).group(0)
          import subprocess
          for arch in index["architectures"]:
              src_pk = pathlib.Path(f"dist/artifacts/release-{arch}/ota_ed25519.pk")
              got = hashlib.sha256(src_pk.read_bytes()).hexdigest()
              assert got == pin, f"{arch} pk drift: {got}"
          pk = pathlib.Path("dist/artifacts/release-x86_64/ota_ed25519.pk")
          (merge / "ota_ed25519.pk").write_bytes(pk.read_bytes())
          # sbom (任一架构副本, 内容同源)
          for arch in ("x86_64", "aarch64"):
              sbom = pathlib.Path(f"dist/artifacts/release-{arch}/sbom.cdx.json")
              if sbom.is_file():
                  (merge / "sbom.cdx.json").write_bytes(sbom.read_bytes())
                  break
          print(json.dumps(index, indent=2))
          PY
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88.0"
      - name: release_tree_verify on both bundles (B5a)
        run: |
          set -euo pipefail
          VERSION=${{ needs.prepare.outputs.version }}
          MERGE="dist/release-$VERSION"
          # release_tree_verify 测试进程 CWD 在 crate 目录 — GR_RT_* 必须绝对路径
          for arch in x86_64 aarch64; do
            BUNDLE="$PWD/$MERGE/greenpng-${VERSION}-${arch}.tar.gz"
            [[ -f "$BUNDLE" ]] || { echo "missing bundle: $BUNDLE" >&2; exit 1; }
            GR_RT_BUNDLE="$BUNDLE" \
            GR_RT_PUBKEY="$PWD/$MERGE/ota_ed25519.pk" \
            cargo test -p gr-ota --test release_tree_verify -- --nocapture
          done
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-dist
          path: dist/release-${{ needs.prepare.outputs.version }}
          if-no-files-found: error

  gate-b:
    # 打包后再测: 用户用这份字节装得上、升得上、健康门过 (双架构)。
    needs: [prepare, merge]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runs-on: ubuntu-24.04
          - arch: aarch64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.88.0"
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-dist
          path: dist/release
      - name: verify artifact pk == installer pin
        run: |
          set -euo pipefail
          VERSION=${{ needs.prepare.outputs.version }}
          # download-artifact 把 release-dist 的文件直接解到 dist/release/ (无嵌套层)
          DIST="$PWD/dist/release"
          [[ -d "$DIST" ]] || { find dist -maxdepth 3 -type d; echo "dist tree missing" >&2; exit 1; }
          pin=$(grep -oE '4a2296d3[0-9a-f]{56}|6dffd7d3[0-9a-f]{56}' install/install.sh | head -1)
          got=$(sha256sum "$DIST/ota_ed25519.pk" | awk '{print $1}')
          [[ "$got" == "$pin" ]] || { echo "artifact pk drift" >&2; exit 1; }
          echo "DIST=$DIST" >> "$GITHUB_ENV"
          SRV_PORT=$((18000 + RANDOM % 2000))
          echo "SRV_PORT=$SRV_PORT" >> "$GITHUB_ENV"
          nohup python3 -m http.server "$SRV_PORT" --bind 127.0.0.1 --directory "$DIST" >/tmp/srv.log 2>&1 &
          sleep 2
          curl -fsS "http://127.0.0.1:${SRV_PORT}/manifest-index.json" >/dev/null && echo "artifact server up"
      - name: B1 sh install from this artifact
        run: |
          set -euo pipefail
          cd install/docker
          if [[ ! -f .env ]]; then
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" > .env
            echo "REDIS_PASSWORD=$(openssl rand -hex 16)" >> .env
          fi
          docker compose up -d
          for db in gr_biz gr_admin gr_assoc; do
            ok=0
            for i in $(seq 1 90); do
              docker compose exec -T postgres psql -U greenpng -d postgres -c "CREATE DATABASE $db" >/dev/null 2>&1 || true
              if docker compose exec -T postgres psql -U greenpng -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" 2>/dev/null | grep -q 1; then
                ok=1; break
              fi
              sleep 1
            done
            [[ "$ok" == 1 ]] || { echo "db $db never appeared" >&2; exit 1; }
          done
          cd "$GITHUB_WORKSPACE"
          set -a; source install/docker/.env; set +a
          cat > "$RUNNER_TEMP/gr.env" <<EOF
          GR_DATABASE_URL=postgres://greenpng:${POSTGRES_PASSWORD}@127.0.0.1:5432/greenpng
          GR_BIZ_DATABASE_URL=postgres://greenpng:${POSTGRES_PASSWORD}@127.0.0.1:5432/gr_biz
          GR_ASSOCIATION_DATABASE_URL=postgres://greenpng:${POSTGRES_PASSWORD}@127.0.0.1:5432/gr_assoc
          GR_ADMIN_DATABASE_URL=postgres://greenpng:${POSTGRES_PASSWORD}@127.0.0.1:5432/gr_admin
          GR_REDIS_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:6379/0
          GR_OFFICIAL_URL=https://example.com
          GR_OAUTH_ADMIN_EMAILS=admin@example.com
          GR_OAUTH_LOCAL_USER=admin
          GR_OAUTH_REDIRECT_URI=http://127.0.0.1:28680/oauth/callback
          GR_ANALYZE_WORKERS=1
          EOF
          VERSION=${{ needs.prepare.outputs.version }}
          GR_RELEASE_BASE="http://127.0.0.1:${SRV_PORT}/" \
          GR_RAW_BASE="http://127.0.0.1:${SRV_PORT}/" \
            bash install/install.sh --arch "${{ matrix.arch }}" --version "$VERSION" \
              --prefix "$RUNNER_TEMP/gr" --env-file "$RUNNER_TEMP/gr.env" \
              --no-systemd --yes 2>&1 | tee /tmp/install-b1.log
          grep -E '^(VERSION|ARCH|CONSOLE|PREFIX)=' "$RUNNER_TEMP/gr/install-state.env"
          bash install/test/smoke_install.sh --prefix "$RUNNER_TEMP/gr"
      - name: B2 --with-docker install from this artifact
        run: |
          set -euo pipefail
          # 清场: 前序步骤的 gr-service 可能仍占默认端口 28680 (TERM 可能被忽略/慢收敛)。
          # 双击 kill + 等端口真正释放; 仍被占则 ss 取证后失败 (不盲装)。
          pkill -f gr-service 2>/dev/null || true
          sleep 1
          pkill -9 -f 'bin/gr-service' 2>/dev/null || true
          for i in $(seq 1 15); do
            curl -fsS --max-time 2 http://127.0.0.1:28680/v1/health >/dev/null 2>&1 || break
            pkill -9 -f 'bin/gr-service' 2>/dev/null || true
            sleep 1
          done
          if curl -fsS --max-time 2 http://127.0.0.1:28680/v1/health >/dev/null 2>&1; then
            echo "port 28680 still occupied after cleanup — holder:" >&2
            ss -ltnp | grep -E ':28680' >&2 || true
            exit 1
          fi
          VERSION=${{ needs.prepare.outputs.version }}
          GR_RELEASE_BASE="http://127.0.0.1:${SRV_PORT}/" \
          GR_RAW_BASE="http://127.0.0.1:${SRV_PORT}/" \
            bash install/install.sh --arch "${{ matrix.arch }}" --version "$VERSION" \
              --with-docker --prefix "$RUNNER_TEMP/gr-docker" --no-systemd --yes 2>&1 | tee /tmp/install-b2.log
          bash install/test/smoke_install.sh --prefix "$RUNNER_TEMP/gr-docker"
      - name: B3 upgrade from previous stable (gr-server channel)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 上一稳定版 = 本公开发行仓 (greenpng/gr-server) 上版本号最高的历史 Release。
          # 旧私有仓 greenpng/install 已废弃 (8.0.2 及更早的发行渠道不再使用);
          # 本仓 v8.0.3 起为唯一发行/OTA 通道, 升级路径始终在仓内闭环验证。
          VERSION=${{ needs.prepare.outputs.version }}
          PREV="$(gh release list -R greenpng/gr-server --limit 30 \
                --json tagName,isPrerelease \
                --jq '.[] | select(.isPrerelease|not) | .tagName | ltrimstr("v")' \
                | sort -rV | grep -v "^${VERSION}$" | head -1 || true)"
          if [[ -z "${PREV:-}" ]]; then
            echo "[B3] no previous stable release on greenpng/gr-server yet (first release on this channel) — upgrade test skipped"
            exit 0
          fi
          echo "[B3] previous stable: v${PREV} → upgrade target v${VERSION}"
          # 清场: B1/B2 的 gr-service 可能仍占默认端口 (同 B2 的双击 kill + 端口释放等待)
          pkill -f gr-service 2>/dev/null || true
          sleep 1
          pkill -9 -f 'bin/gr-service' 2>/dev/null || true
          for i in $(seq 1 15); do
            curl -fsS --max-time 2 http://127.0.0.1:28680/v1/health >/dev/null 2>&1 || break
            pkill -9 -f 'bin/gr-service' 2>/dev/null || true
            sleep 1
          done
          if curl -fsS --max-time 2 http://127.0.0.1:28680/v1/health >/dev/null 2>&1; then
            echo "port 28680 still occupied after cleanup — holder:" >&2
            ss -ltnp | grep -E ':28680' >&2 || true
            exit 1
          fi
          # 安装上一稳定版 (公开仓资产, 同一信任根, install.sh 默认通道即本仓)
          GR_RELEASE_BASE="https://github.com/greenpng/gr-server/releases/download/v${PREV}" \
            bash install/install.sh --arch "${{ matrix.arch }}" --version "$PREV" \
              --prefix "$RUNNER_TEMP/gr-old" --env-file "$RUNNER_TEMP/gr.env" \
              --no-systemd --yes 2>&1 | tee /tmp/install-b3-old.log
          # 升级到本次 artifact (本地资产服务器, 与用户从 Release 页升级同字节)
          VERSION="$VERSION" INSTALL_ROOT="$RUNNER_TEMP/gr-old" \
          GR_RELEASE_BASE="http://127.0.0.1:${SRV_PORT}/" \
            bash install/release/update_runtime_from_github.sh 2>&1 | tee /tmp/install-b3-up.log
          # 升级后健康门 + 版本落位
          bash install/test/smoke_install.sh --prefix "$RUNNER_TEMP/gr-old"
          [[ "$(tr -d '[:space:]' < "$RUNNER_TEMP/gr-old/VERSION")" == "$VERSION" ]] || {
            echo "upgrade did not land VERSION=$VERSION" >&2; exit 1; }
          ls "$RUNNER_TEMP/gr-old/bin/releases/" | head -5
      - name: B5 release_tree_verify on both bundles
        run: |
          set -euo pipefail
          VERSION=${{ needs.prepare.outputs.version }}
          for arch in x86_64 aarch64; do
            BUNDLE="$DIST/greenpng-${VERSION}-${arch}.tar.gz"
            [[ -f "$BUNDLE" ]] || { echo "missing bundle: $BUNDLE" >&2; exit 1; }
            GR_RT_BUNDLE="$BUNDLE" \
            GR_RT_PUBKEY="$DIST/ota_ed25519.pk" \
            cargo test -p gr-ota --test release_tree_verify -- --nocapture
          done
      - name: upload gate-b logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: gate-b-${{ matrix.arch }}
          path: |
            /tmp/install-b1.log
            /tmp/install-b2.log
            /tmp/install-b3-old.log
            /tmp/install-b3-up.log
          if-no-files-found: ignore

  publish:
    # Gate B 全绿才发版: tag v<VERSION> 打在与打包相同的 commit; 已有 tag 拒绝覆盖。
    # 发版策略 (2026-09-09): 测试全绿即自动发版, 不挂 production environment
    # 审批门 — 曾挂 required_reviewers 导致 publish waiting 等人工点击
    # (v1.0.8 run 34340575912)。审计走 run log + Release + provenance;
    # 环境侧 required_reviewers 规则也已清除 (幂等: 两处都不再依赖)。
    needs: [prepare, gate-b]
    if: inputs.publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-dist
          path: dist/release
      - name: tag + create GitHub Release (immutable)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=${{ needs.prepare.outputs.version }}
          # download-artifact 把 release-dist 的文件直接解到 dist/release/ (无嵌套层)
          MERGE="dist/release"
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG exists — refusing to mutate immutable tag/assets" >&2
            exit 1
          fi
          sha="$(git rev-parse HEAD)"
          mapfile -t ASSETS < <(find "$MERGE" -maxdepth 1 -type f | sort)
          gh release create "$TAG" "${ASSETS[@]}" --repo "${{ github.repository }}" \
            --target "$sha" \
            --title "greenpng ${VERSION}" \
            --notes "Multi-arch release (x86_64 + aarch64). VERSION=${VERSION} commit=${sha}.

          Install: \`curl -fsSL https://raw.githubusercontent.com/greenpng/gr-server/main/install/install.sh | bash\`
          Update: panel OTA or \`install/release/update_runtime_from_github.sh\` (same tag).

          Assets are immutable; fixes ship as a new PATCH version."
          echo "published $TAG"

  provenance:
    needs: publish
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-dist
          path: dist/release
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/greenpng-*.tar.gz
            dist/release/fe-*.tgz
            dist/release/manifest-index.json
            dist/release/ota_ed25519.pk
            dist/release/sbom.cdx.json
