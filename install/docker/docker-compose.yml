# greenpng 数据/缓存服务 (仅数据层 — 本体由 install.sh 安装)
#
#   postgres: 4 个业务库 (greenpng 主库 + gr_biz/gr_admin/gr_assoc)
#   redis:    soft store / 多 worker 共享 L2 / R100 模板 (可选)
#
# 用法:
#   cd docker && cp .env.example .env  # 或由 install.sh --with-docker 自动生成随机密码
#   docker compose up -d
#
# 端口默认仅回环监听 (127.0.0.1), 可通过 POSTGRES_PORT / REDIS_PORT 覆盖
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # PG 调优 (178 四维实测: 默认 shared_buffers=128MB 在 analyze 队列负载下
    # 偏小)。保守默认 + .env 可覆写; synchronous_commit 保持 on (证据数据
    # 持久性是产品属性, 不在默认里翻)。改 command 后 `docker compose up -d`
    # 会以同卷重建容器, 配置即生效。
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-256MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      - -c
      - synchronous_commit=${PG_SYNCHRONOUS_COMMIT:-on}
    environment:
      POSTGRES_USER: greenpng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: greenpng
      GR_DB_BIZ: ${GR_DB_BIZ:-gr_biz}
      GR_DB_ADMIN: ${GR_DB_ADMIN:-gr_admin}
      GR_DB_ASSOC: ${GR_DB_ASSOC:-gr_assoc}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - greenpng_pg:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenpng -d greenpng"]
      interval: 3s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set in .env}
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - greenpng_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 3s
      timeout: 2s
      retries: 20

volumes:
  greenpng_pg:
  greenpng_redis:
