# GitHub runner 上测试 sh 安装路径 (x86_64 + aarch64)

#

# 数据/缓存服务用本机 docker 起好 (模拟"用户自备数据服务, 手工填连接串"场景),

# gv6 本体走 install.sh --env-file 非交互安装, 然后冒烟。

name: test-install-sh



on:

  workflow_dispatch:

    inputs:

      version:

        description: "V7 发布版本(默认 7.0.2)"

        type: string

        required: false

        default: "8.0.0"

  push:

    tags:

      - "v*"



permissions:

  contents: read



jobs:

  install-sh:

    strategy:

      fail-fast: false

      matrix:

        include:

          - arch: x86_64

            runs-on: ubuntu-24.04

          - arch: aarch64

            runs-on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}

    steps:

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2



      - name: clean stale services from previous runs (reused runners)

        run: |

          pkill -f 'gr-service|gv6-service' 2>/dev/null || true

          (cd docker && docker compose down -v 2>/dev/null || true) || true

          sleep 2



      - name: start data services (postgres 4db + redis)

        run: |

          set -euo pipefail

          cd docker

          if [[ ! -f .env ]]; then

            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" > .env

            echo "REDIS_PASSWORD=$(openssl rand -hex 16)" >> .env

          fi

          docker compose up -d

          # pg_isready is not enough: /docker-entrypoint-initdb.d may still be

          # running — the probe plane panics its biz/assoc threads and degrades

          # to gateway-only if those DBs are missing when gr-service starts.

          # 8.0 init creates gr_* by default; legacy gv6_* kept for 7.x rollback

          # tests. The CREATE is retried inside the wait loop: an attempt issued

          # while initdb is still running fails silently (psql refused), which

          # stranded the legacy gv6_* wait on fresh runners (v8.0.0 incident).

          for db in gr_biz gr_admin gr_assoc gv6_biz gv6_admin gv6_assoc; do

            ok=0

            for i in $(seq 1 90); do

              docker compose exec -T postgres psql -U gv6 -d postgres -c "CREATE DATABASE $db" >/dev/null 2>&1 || true

              if docker compose exec -T postgres psql -U gv6 -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$db'" 2>/dev/null | grep -q 1; then

                echo "db $db ready after ${i}s"

                ok=1

                break

              fi

              echo "waiting for db $db (${i}/90)"

              sleep 1

            done

            [[ "$ok" == 1 ]] || { echo "db $db never appeared" >&2; exit 1; }

          done



      - name: write connection env file (管理面/业务面分组)

        run: |

          set -euo pipefail

          set -a; source docker/.env; set +a

          cat > "$RUNNER_TEMP/gv6.env" <<EOF

          # 业务面 (探测/分析)

          GV6_DATABASE_URL=postgres://gv6:${POSTGRES_PASSWORD}@127.0.0.1:5432/greenv6

          GR_BIZ_DATABASE_URL=postgres://gv6:${POSTGRES_PASSWORD}@127.0.0.1:5432/gr_biz

          GV6_BIZ_DATABASE_URL=postgres://gv6:${POSTGRES_PASSWORD}@127.0.0.1:5432/gv6_biz

          GR_ASSOCIATION_DATABASE_URL=postgres://gv6:${POSTGRES_PASSWORD}@127.0.0.1:5432/gr_assoc

          GV6_ASSOCIATION_DATABASE_URL=postgres://gv6:${POSTGRES_PASSWORD}@127.0.0.1:5432/gv6_assoc

          # 管理面 (面板/审计)

          GR_ADMIN_DATABASE_URL=postgres://gv6:${POSTGRES_PASSWORD}@127.0.0.1:5432/gr_admin

          GV6_ADMIN_DATABASE_URL=postgres://gv6:${POSTGRES_PASSWORD}@127.0.0.1:5432/gv6_admin

          # 缓存

          GR_REDIS_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:6379/0

          GV5_REDIS_URL=redis://:${REDIS_PASSWORD}@127.0.0.1:6379/0

          # 面板登录 (runner 上不开真实官网, 用占位)

          GV6_OFFICIAL_URL=https://example.com

          GV6_OAUTH_ADMIN_EMAILS=admin@example.com

          GV6_OAUTH_LOCAL_USER=admin

          GV6_OAUTH_REDIRECT_URI=http://127.0.0.1:28680/oauth/callback

          GV6_ANALYZE_WORKERS=1

          EOF



      - name: run install.sh (sh 安装路径)

        id: install

        run: |

          set -euo pipefail

          ARGS=(--arch "${{ matrix.arch }}" --prefix "$RUNNER_TEMP/gv6" \

                --env-file "$RUNNER_TEMP/gv6.env" --no-systemd --yes)

          VERSION="${{ inputs.version || '8.0.0' }}"

          [[ "$VERSION" =~ ^(7|8)\.[0-9]+\.[0-9]+$ ]] || { echo "V7/GR workflow requires 7.x.y or 8.x.y"; exit 1; }

          ARGS+=(--version "$VERSION")

          bash install.sh "${ARGS[@]}" 2>&1 | tee /tmp/install.log

          [[ -f "$RUNNER_TEMP/gv6/install-state.env" ]] || { cat /tmp/install.log; exit 1; }

          grep -E '^(VERSION|ARCH|CONSOLE|PREFIX)=' "$RUNNER_TEMP/gv6/install-state.env"



      - name: smoke test

        run: |

          bash test/smoke_install.sh --prefix "$RUNNER_TEMP/gv6" || true

          # 服务由 install.sh --no-systemd 后台拉起; 若健康门已在安装期通过, 冒烟应全绿

          bash test/smoke_install.sh --prefix "$RUNNER_TEMP/gv6"



      - name: upload logs

        if: always()

        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3

        with:

          name: install-sh-${{ matrix.arch }}

          path: |

            /tmp/install.log

            ${{ runner.temp }}/gv6/log/

          if-no-files-found: ignore
