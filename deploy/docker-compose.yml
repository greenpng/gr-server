# Docker one-shot: PG multi-db + Redis + gr-service (auto DSN).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gr
      POSTGRES_PASSWORD: grdev
      POSTGRES_DB: greenv6
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gr -d greenv6"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  gr:
    build:
      context: ../..
      dockerfile: 04-release-github-ci/deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GR_BIND: 0.0.0.0:28680
      GR_DATA_DIR: /data
      GR_MODULES_DIR: /modules
      GR_ADMIN_SPA: /app/admin-spa
      GR_DATABASE_URL: postgres://gr:grdev@postgres:5432/greenv6
      GR_BIZ_DATABASE_URL: postgres://gr:grdev@postgres:5432/gr_biz
      GR_ADMIN_DATABASE_URL: postgres://gr:grdev@postgres:5432/gr_admin
      GR_ASSOCIATION_DATABASE_URL: postgres://gr:grdev@postgres:5432/gr_assoc
      GR_REDIS_URL: redis://redis:6379/0
      GR_CLUSTER_KEY: docker-dev-cluster
      GR_DEPLOY_ENV: docker
    ports:
      - "28680:28680"
    volumes:
      - grdata:/data
      - grmodules:/modules

volumes:
  pgdata:
  grdata:
  grmodules:
