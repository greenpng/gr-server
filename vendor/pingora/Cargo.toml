




[workspace]
resolver = "2"
members = [
    "pingora",
    "pingora-core",
    "pingora-pool",
    "pingora-error",
    "pingora-limits",
    "pingora-timeout",
    "pingora-header-serde",
    "pingora-proxy",
    "pingora-cache",
    "pingora-http",
    "pingora-lru",
    "pingora-openssl",
    "pingora-boringssl",
    "pingora-runtime",
    "pingora-rustls",
    "pingora-ketama",
    "pingora-load-balancing",
    "pingora-memory-cache",
    "pingora-prometheus",
    "tinyufo",
]

# NOTE: pingora-s2n is intentionally NOT a workspace member — its s2n-tls 0.3.42
# requires rustc >= 1.91 (host toolchain is 1.88) and nothing enables the s2n TLS
# feature (gv6-probe-plane uses openssl only). Keeps `cargo build --workspace`
# buildable on rustc 1.88.

[workspace.dependencies]
bstr = "1.12.0"
tokio = "1"
tokio-stream = { version = "0.1" }
async-trait = "0.1.42"
httparse = "1"
bytes = "1.0"
derivative = "2.2.0"
http = "1"
log = "0.4"
futures = "0.3"
h2 = ">=0.4.11"
once_cell = "1"
lru = "0.16.3"
ahash = ">=0.8.9"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[profile.bench]
debug = true
