<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>Probe Completeness · missing_probe / main_complete</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 24px; background: #0f1419; color: #e7ecf1; }
    h1 { font-size: 1.25rem; }
    .muted { color: #8b9aab; font-size: 0.9rem; }
    table { border-collapse: collapse; width: 100%; margin-top: 16px; font-size: 0.9rem; }
    th, td { border: 1px solid #2a3544; padding: 8px 10px; text-align: left; }
    th { background: #1a2332; }
    tr:nth-child(even) { background: #141c27; }
    .ok { color: #3dd68c; }
    .bad { color: #f07178; }
    .mid { color: #e6b450; }
    input, button { background: #1a2332; color: #e7ecf1; border: 1px solid #2a3544; padding: 6px 10px; border-radius: 6px; }
    button { cursor: pointer; margin-left: 8px; }
    #summary { margin-top: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
    .card { background: #1a2332; padding: 12px 16px; border-radius: 8px; min-width: 140px; }
    .card b { display: block; font-size: 1.4rem; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>探测完整率看板</h1>
  <p class="muted">
    main_complete = 会话已有 B0_bootstrap + B10_hw_curves（窗口打开期间渐进上传目标）。
    missing_probe = 分析侧 os 材料缺失。按 site × product_version 分组。
    API: <code>GET /v1/ops/probe_completeness?hours=24</code>
  </p>
  <div>
    <label>hours <input id="hours" type="number" value="24" min="1" max="672" style="width:72px" /></label>
    <button id="reload">刷新</button>
    <span id="status" class="muted"></span>
  </div>
  <div id="summary"></div>
  <table>
    <thead>
      <tr>
        <th>site_id</th>
        <th>product_version</th>
        <th>sessions</th>
        <th>main_complete</th>
        <th>main_complete_rate</th>
        <th>missing_probe</th>
        <th>missing_rate</th>
        <th>gateway_only</th>
        <th>real_curves</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <script>
    function pct(x) {
      if (x == null || isNaN(x)) return '—';
      return (100 * Number(x)).toFixed(1) + '%';
    }
    function cls(rate) {
      if (rate == null) return '';
      if (rate >= 0.7) return 'ok';
      if (rate >= 0.35) return 'mid';
      return 'bad';
    }
    async function load() {
      const h = document.getElementById('hours').value || 24;
      const st = document.getElementById('status');
      st.textContent = 'loading…';
      try {
        const r = await fetch('/v1/ops/probe_completeness?hours=' + encodeURIComponent(h), {
          credentials: 'same-origin'
        });
        const d = await r.json();
        if (!d.ok && d.error) throw new Error(d.error);
        document.getElementById('summary').innerHTML = [
          ['sessions', d.sessions],
          ['main_complete_rate', pct(d.main_complete_rate)],
          ['missing_probe_rate', pct(d.missing_probe_rate)],
          ['hours', d.hours || h],
        ].map(([k,v]) => '<div class="card">' + k + '<b>' + v + '</b></div>').join('');
        const tb = document.getElementById('rows');
        tb.innerHTML = '';
        (d.by_site_version || []).forEach(row => {
          const tr = document.createElement('tr');
          const mcr = row.main_complete_rate;
          const mr = row.missing_probe_rate;
          tr.innerHTML = [
            row.site_id, row.product_version, row.sessions,
            row.main_complete, '<span class="' + cls(mcr) + '">' + pct(mcr) + '</span>',
            row.missing_probe != null ? row.missing_probe : (row.missing_probe_est != null ? row.missing_probe_est : '—'),
            '<span class="' + cls(1 - (mr || 0)) + '">' + pct(mr) + '</span>',
            row.gateway_only != null ? row.gateway_only : '—',
            row.real_curves != null ? row.real_curves : '—',
          ].map(c => '<td>' + c + '</td>').join('');
          tb.appendChild(tr);
        });
        st.textContent = 'ok · backend=' + (d.backend || 'pg') + ' · ' + new Date().toISOString();
      } catch (e) {
        st.textContent = 'error: ' + e;
      }
    }
    document.getElementById('reload').onclick = load;
    load();
  </script>
</body>
</html>
