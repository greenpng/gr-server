<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00bcd4" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#06090f" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Shield Badge Icon -->
  <g transform="translate(6, 5)">
    <!-- Outer Shield Frame -->
    <polygon points="20,2 38,9 38,27 20,38 2,27 2,9" fill="url(#shieldBg)" stroke="url(#cyberGreen)" stroke-width="2" filter="url(#glow)"/>
    
    <!-- Inner Cyber Circuit Nodes -->
    <circle cx="20" cy="12" r="2.5" fill="#00ff88"/>
    <circle cx="12" cy="24" r="2" fill="#00bcd4"/>
    <circle cx="28" cy="24" r="2" fill="#00bcd4"/>
    <line x1="20" y1="12" x2="12" y2="24" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="20" y1="12" x2="28" y2="24" stroke="#00ff88" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="12" y1="24" x2="20" y2="30" stroke="#00bcd4" stroke-width="1.5" stroke-opacity="0.8"/>
    <line x1="28" y1="24" x2="20" y2="30" stroke="#00bcd4" stroke-width="1.5" stroke-opacity="0.8"/>
    <circle cx="20" cy="30" r="3" fill="#00ff88" filter="url(#glow)"/>
  </g>

  <!-- Brand Typography -->
  <text x="56" y="32" font-family="'JetBrains Mono', 'Fira Code', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="-0.5px">
    <tspan fill="#f1f5f9">green</tspan><tspan fill="#00ff88">png</tspan><tspan fill="#00bcd4">.</tspan>
  </text>
  <text x="160" y="20" font-family="-apple-system, sans-serif" font-size="8" font-weight="700" fill="#00ff88" letter-spacing="1px" opacity="0.85">CORE</text>
</svg>